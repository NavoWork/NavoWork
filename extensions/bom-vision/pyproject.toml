[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "navowork-bom-vision"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["Pillow>=10.4,<14"]

[project.scripts]
bom-vision = "bom_vision.cli:main"

[tool.setuptools.packages.find]
include = ["bom_vision*"]
