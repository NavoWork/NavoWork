[project]
name = "navowork-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "navowork-agent==0.1.0",
  "fastapi==0.162.0", "uvicorn==0.54.0", "sqlalchemy==2.1.6",
  "alembic==1.20.1", "langgraph==1.2.19",
  "langgraph-checkpoint-sqlite==3.1.3", "langchain==1.4.7",
  "langchain-openai==1.7.3", "python-multipart==0.0.32",
  "openpyxl==3.1.5", "pypdf==6.21.4", "reportlab==5.1.0", "Pillow>=10.4,<14"
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
