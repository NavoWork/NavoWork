[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "navowork-agent"
version = "0.1.0"
description = "Case-scoped file tools and resumable quotation agent"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.14,<3", "openpyxl==3.1.5", "python-docx==1.2.0",
  "pypdf>=6.10,<7", "reportlab>=4.4.9,<6",
  "langgraph==1.2.19", "langgraph-checkpoint-sqlite==3.1.3",
  "langchain==1.4.7", "langchain-openai==1.7.3",
]

[project.optional-dependencies]
test = ["pytest==9.2.0"]

[project.scripts]
navowork-agent = "navowork_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
navowork_agent = ["skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
